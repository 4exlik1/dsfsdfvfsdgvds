name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          unzip -q humanminer-fabric-1.20.1-ready.zip
          cd humanminer-fabric-1.20.1
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: humanminer
          path: humanminer-fabric-1.20.1/build/libs/*.jar
